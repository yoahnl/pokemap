name: pokemap_product_certification
description: Offline product-certification harness for PokeMap Hub.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  map_core:
    path: ../../packages/map_core
  map_distribution:
    path: ../../packages/map_distribution
  map_editor:
    path: ../../packages/map_editor
  map_gameplay:
    path: ../../packages/map_gameplay
  map_runtime:
    path: ../../packages/map_runtime
  path: ^1.9.0
  pokemap_hub:
    path: ../../apps/pokemap_hub
  pub_semver: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true
