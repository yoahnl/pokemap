name: map_player_ui
description: Reusable Flutter design system and player surfaces for PokeMap games.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_joystick: ^0.2.2
  gamepads: ^0.1.10+1
  map_runtime:
    path: ../map_runtime
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  map_core:
    path: ../map_core

flutter:
  uses-material-design: true
  fonts:
    - family: PokeMapSplashMarcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf
    - family: PokeMapSplashDMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 600
