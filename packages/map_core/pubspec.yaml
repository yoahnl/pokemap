name: map_core
description: Core data models for the RPG Map Editor.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  characters: ^1.4.0
  crypto: ^3.0.7
  # Consumers may use either Freezed 2 or 3; map_core remains Riverpod-free.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  meta: ^1.11.0
  uuid: ^4.5.3
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: 6.12.0
  lints: ^6.1.0
  test: ^1.24.0
