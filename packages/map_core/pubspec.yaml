name: map_core
description: Core data models for the RPG Map Editor.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  # Consumers may use either Freezed 2 or 3; map_core remains Riverpod-free.
  freezed_annotation: '>=2.4.1 <4.0.0'
  json_annotation: ^4.8.1
  meta: ^1.11.0
  uuid: ^4.5.3
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  lints: ^3.0.0
  test: ^1.24.0
