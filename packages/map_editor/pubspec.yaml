name: map_editor
description: Flutter Desktop Map Editor for RPG projects.
version: 0.3.1+301
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  path_provider: ^2.1.2
  package_info_plus: ^9.0.0
  file_picker: ^8.0.0
  image: ^4.2.0
  crypto: ^3.0.7
  path: ^1.8.3
  pub_semver: ^2.2.0
  map_core:
    path: ../map_core
  map_authoring:
    path: ../map_authoring
  map_distribution:
    path: ../map_distribution
  map_gameplay:
    path: ../map_gameplay
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flame_audio: ^2.12.1
  video_player: 2.9.5

dev_dependencies:
  cryptography: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  # Debug-only desktop QA bridge. The production entrypoint never imports it.
  marionette_flutter: ^0.5.0
  marionette_mcp: ^0.6.0
  riverpod_generator: ^2.3.9
  xml: ^7.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Product mark supplied by the Event Builder V2 north-star. Keeping the
    # raster source avoids replacing a visible brand asset with drawn UI art.
    - assets/branding/pokemap_event_builder_mark.png
    - assets/branding/pokemap_event_builder_project_thumb.png
    # Versioned open-source font used only to make visual-test output portable
    # and deterministic across desktop hosts.
    - assets/fonts/pokemap_capture_sans_regular.ttf
    - assets/fonts/pokemap_capture_sans_LICENSE.txt
    - assets/cinematics/emotes/emotions.png
    - assets/cinematics/emotes/emotions2.png
