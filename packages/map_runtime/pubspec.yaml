name: map_runtime
description: >-
  Read-only Flame viewer for maps created with the RPG Map Editor format.
  Loads a project.json, resolves tileset assets, and renders
  tile, terrain, path, entity and collision layers in a Flame scene.
version: 0.1.0
publish_to: none

repository: https://git.yoahn.me/yoahn/pokemonProject.git

topics:
  - game
  - map
  - flame
  - rpg

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  flame_audio: ^2.12.1
  image: ^4.2.0
  archive: ^4.0.9
  path: ^1.8.3
  path_provider: ^2.1.2
  map_core:
    path: ../map_core
  map_authoring:
    path: ../map_authoring
  map_gameplay:
    path: ../map_gameplay
  map_battle:
    path: ../map_battle
  # Composition with Riverpod 3 code generation resolves Freezed 3.
  freezed_annotation: '>=2.4.1 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  freezed: ^3.2.5

flutter:
  shaders:
    - shaders/battle_transition_dissolve.frag
  assets:
    - assets/audio/
    - assets/audio/battle/se/
    - assets/transitions/
    - assets/battle/balls/
    - assets/battle/stats/
    - assets/battle_animations/
    - assets/cinematics/emotes/
    - assets/menu/items/
