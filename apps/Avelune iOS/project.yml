name: AveluneiOS
options:
  bundleIdPrefix: com.yoahnl.avelune
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

schemes:
  AveluneiOS:
    build:
      targets:
        AveluneiOS: all
      preActions:
        - name: Select Flutter build mode
          settingsTarget: AveluneiOS
          script: /bin/sh "$FLUTTER_SWIFT_PACKAGE_OUTPUT/Scripts/flutter_integration.sh" prebuild
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      targets:
        - AveluneiOSTests
    archive:
      config: Release
  AveluneVisualGate:
    build:
      targets:
        AveluneiOS: all
    test:
      targets:
        - AveluneiOSUITests

packages:
  FlutterNativeIntegration:
    path: flutter_runtime/build/swift-package/FlutterNativeIntegration

settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: AveluneiOS/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.yoahnl.avelune.player
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"

targets:
  AveluneiOS:
    type: application
    platform: iOS
    sources:
      - path: AveluneiOS
    resources:
      - path: AveluneiOS/Resources
    dependencies:
      - package: FlutterNativeIntegration
    postBuildScripts:
      - name: Verify Flutter framework
        script: /bin/sh "$FLUTTER_SWIFT_PACKAGE_OUTPUT/Scripts/flutter_integration.sh" assemble
        inputFileLists:
          - "$(FLUTTER_SWIFT_PACKAGE_OUTPUT)/Scripts/FlutterAssembleInputs.xcfilelist"
        basedOnDependencyAnalysis: false
    settings:
      base:
        INFOPLIST_FILE: AveluneiOS/Resources/Info.plist
        FLUTTER_SWIFT_PACKAGE_OUTPUT: "$(PROJECT_DIR)/flutter_runtime/build/swift-package"
        PRODUCT_BUNDLE_IDENTIFIER: com.yoahnl.avelune.player
        DEVELOPMENT_TEAM: NLNMNV3B3S
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/flutter_runtime/build/ios/framework/Release"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
  AveluneiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AveluneiOSTests
    dependencies:
      - target: AveluneiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
  AveluneiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AveluneiOSUITests
    dependencies:
      - target: AveluneiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
