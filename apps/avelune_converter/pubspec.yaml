name: avelune_converter
description: Conversion locale de projets RPG Maker XP et Pokémon Essentials vers Avelune Studio.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  avelune_converter_core:
    path: ../../packages/avelune_converter_core
  avelune_converter_adapters:
    path: ../../packages/avelune_converter_adapters
  avelune_design_system:
    path: ../../packages/avelune_design_system
  map_core:
    path: ../../packages/map_core
  file_picker: 11.0.3
  image: 4.10.1
  path: ^1.9.1
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  marionette_flutter: ^0.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/avelune_logo.png
