name: avelune_studio
description: "Avelune Studio, édition de cartes PokeMap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  file_picker: 11.0.3
  map_authoring:
    path: ../../packages/map_authoring
  map_core:
    path: ../../packages/map_core
  map_runtime:
    path: ../../packages/map_runtime
  flame: ^1.38.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.2.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/home/hero_landscape.png
    - assets/home/avelune_symbol.png
    - assets/home/avelune_logo.png
