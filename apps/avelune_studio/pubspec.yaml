name: avelune_studio
description: "Avelune Studio, édition de cartes PokeMap."
publish_to: 'none'
version: 0.3.24+324

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  file_picker: 11.0.3
  http: ^1.2.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  map_authoring:
    path: ../../packages/map_authoring
  map_core:
    path: ../../packages/map_core
  map_gameplay:
    path: ../../packages/map_gameplay
  map_runtime:
    path: ../../packages/map_runtime
  map_player_ui:
    path: ../../packages/map_player_ui
  flame: ^1.38.0
  flame_3d: 0.3.2
  map_render_3d:
    path: ../../packages/map_render_3d
  path: ^1.9.1

dev_dependencies:
  archive: 4.0.9
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.2.0
  marionette_flutter: ^0.6.0
  marionette_mcp: ^0.6.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/home/hero_landscape.png
    - assets/home/avelune_symbol.png
    - assets/home/avelune_logo.png
    - assets/pokemon/item_icons/icons.zip
    - assets/pokemon/item_icons/manifest.json
    - assets/pokemon/capture_sprites/sprites.zip
    - assets/pokemon/capture_sprites/manifest.json
