name: avelune_studio
description: "Socle desktop Avelune Studio, lecture seule de projets PokeMap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: 11.0.3
  map_authoring:
    path: ../../packages/map_authoring
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  map_core:
    path: ../../packages/map_core

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
