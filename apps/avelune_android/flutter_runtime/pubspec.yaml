name: avelune_runtime_android
description: Shared Avelune runtime embedded by the native Android application.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  pokemap_hub:
    path: ../../pokemap_hub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  gamepads_darwin:
    path: ../../../packages/gamepads_darwin
  gamepads_ios:
    path: ../../../packages/gamepads_ios

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.yoahnl.avelune.runtime.android
    iosBundleIdentifier: com.yoahnl.avelune.runtime.android
