beforeSettings { settings ->
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id == 'com.android.library') {
            useVersion('8.11.1')
        }
        if (requested.id.id == 'org.jetbrains.kotlin.android') {
            useVersion('2.2.20')
        }
    }
}
