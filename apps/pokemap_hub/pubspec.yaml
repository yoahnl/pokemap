name: pokemap_hub
description: PokeMap Hub composition root and player application.
version: 0.1.1+2
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  archive: 4.0.9
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  file_picker: ^11.0.3
  flame: ^1.38.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.2.1
  image: ^4.2.0
  image_picker: ^1.2.3
  image_picker_android: 0.8.13+15
  liquid_glass_easy: ^3.5.0
  map_core:
    path: ../../packages/map_core
  map_distribution:
    path: ../../packages/map_distribution
  map_player_ui:
    path: ../../packages/map_player_ui
  map_runtime:
    path: ../../packages/map_runtime
  path: ^1.9.0
  path_provider: ^2.1.6
  pub_semver: ^2.2.0
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.1.0
  marionette_flutter: ^0.6.0
  test: ^1.24.0

  riverpod: 3.2.1
flutter:
  uses-material-design: true
  assets:
    - assets/avelune/artwork/
    - assets/avelune/logo/
    - assets/avelune/materials/
    - assets/avelune/objects/cartridge/
    - assets/avelune/objects/console/
    - assets/avelune/production_manifest.json
    - assets/avelune/room/backgrounds/
    - assets/avelune/room/furniture/
    - assets/certification/intro_landscape_h264_aac.mp4
    - assets/certification/intro_portrait_h264_aac.mp4
  fonts:
    - family: AveluneEditorial
      fonts:
        - asset: assets/avelune/fonts/CormorantGaramond-Variable.ttf
          weight: 400

dependency_overrides:
  gamepads_darwin:
    path: ../../packages/gamepads_darwin
  gamepads_ios:
    path: ../../packages/gamepads_ios
