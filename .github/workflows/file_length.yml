name: File length

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: No Dart file over 3000 lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Enforce the file-length ratchet
        run: dart tools/check_file_length.dart
