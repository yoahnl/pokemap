name: Patch PR5 CI wiring

on:
  push:
    branches:
      - codex/perf-009-soak-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/perf-009-soak-gate
          fetch-depth: 0
      - name: Patch certification workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pokemap_hub_product_certification.yml')
          source = path.read_text()
          replacements = (
              (
                  """      - name: Product certification contracts
        working-directory: tools/pokemap_product_certification
        run: |
          flutter pub get
          flutter test
          flutter analyze""",
                  """      - name: Product certification contracts
        working-directory: tools/pokemap_product_certification
        run: |
          npm ci --prefix ../pokemap_mcp
          flutter pub get
          flutter test
          flutter analyze""",
              ),
              (
                  """          flutter test --no-pub \\
            test/performance_driver_contract_test.dart \\
            test/fine_mask_performance_contract_test.dart""",
                  """          flutter test --no-pub \\
            test/performance_driver_contract_test.dart \\
            test/perf_009_project_performance_driver_test.dart \\
            test/fine_mask_performance_contract_test.dart""",
              ),
              (
                  """          flutter drive --profile -d macos \\
            --driver=test_driver/performance_driver.dart \\
            --target=integration_test/editor_project_journey_test.dart \\
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json""",
                  """          flutter drive --profile -d macos \\
            --driver=test_driver/perf_009_project_performance_driver.dart \\
            --target=integration_test/editor_project_journey_test.dart \\
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json""",
              ),
          )
          expected_counts = (1, 1, 2)
          for (old, new), expected_count in zip(replacements, expected_counts):
              actual_count = source.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f'Expected {expected_count} occurrence(s), found {actual_count}'
                  )
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git diff --check
          git diff -- .github/workflows/pokemap_hub_product_certification.yml
      - name: Commit workflow repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pokemap_hub_product_certification.yml
          git commit -m "ci: align product certification with PERF-009"
          git push origin HEAD:codex/perf-009-soak-gate
