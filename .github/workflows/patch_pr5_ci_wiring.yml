name: Patch PR5 CI wiring

on:
  push:
    branches:
      - codex/perf-009-soak-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/perf-009-soak-gate
          fetch-depth: 0
      - name: Stage certification workflow repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/pokemap_hub_product_certification.yml')
          source = source_path.read_text()
          replacements = (
              (
                  "          flutter pub get\n          flutter test\n          flutter analyze",
                  "          npm ci --prefix ../pokemap_mcp\n          flutter pub get\n          flutter test\n          flutter analyze",
                  1,
              ),
              (
                  "          flutter test --no-pub \\\n            test/performance_driver_contract_test.dart \\\n            test/fine_mask_performance_contract_test.dart",
                  "          flutter test --no-pub \\\n            test/performance_driver_contract_test.dart \\\n            test/perf_009_project_performance_driver_test.dart \\\n            test/fine_mask_performance_contract_test.dart",
                  1,
              ),
              (
                  "          flutter drive --profile -d macos \\\n            --driver=test_driver/performance_driver.dart \\\n            --target=integration_test/editor_project_journey_test.dart \\\n            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json",
                  "          flutter drive --profile -d macos \\\n            --driver=test_driver/perf_009_project_performance_driver.dart \\\n            --target=integration_test/editor_project_journey_test.dart \\\n            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json",
                  2,
              ),
          )
          for old, new, expected_count in replacements:
              actual_count = source.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f'Expected {expected_count} occurrence(s), found {actual_count}'
                  )
              source = source.replace(old, new)
          staged_path = Path('tools/ci/pokemap_hub_product_certification.staged.yml')
          staged_path.parent.mkdir(parents=True, exist_ok=True)
          staged_path.write_text(source)
          PY
          git diff --check -- tools/ci/pokemap_hub_product_certification.staged.yml
      - name: Publish staged workflow blob
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/ci/pokemap_hub_product_certification.staged.yml
          git commit -m "ci: stage corrected product certification workflow"
          git push origin HEAD:codex/perf-009-soak-gate
