name: PokeMap Hub product certification

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Run the protected macOS notarization release gate
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - "apps/pokemap_hub/**"
      - "packages/map_core/**"
      - "packages/map_authoring/**"
      - "packages/map_battle/**"
      - "packages/map_distribution/**"
      - "packages/map_editor/**"
      - "packages/map_gameplay/**"
      - "packages/map_player_ui/**"
      - "packages/map_runtime/**"
      - "examples/playable_runtime_host/**"
      - "documentation/reports/performance/**"
      - "tools/performance/**"
      - "pokemap_roadmap_mecaniques_fangame.md"
      - "documentation/reports/gameplay/**"
      - "tools/pokemap_product_certification/**"
      - ".github/workflows/pokemap_hub_product_certification.yml"
  push:
    branches: [main]
    tags: ["pokemap-hub-v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.46.0-0.3.pre
  FLUTTER_REVISION: 677d472756f83c14371dd8cc624387065f3d32a7

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Hub tests and analysis
        working-directory: apps/pokemap_hub
        run: |
          flutter pub get
          flutter test --timeout 2m --exclude-tags visual
          flutter analyze
          flutter build macos --release
      - name: Verify intro codecs
        working-directory: apps/pokemap_hub
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          tool/release/verify_intro_codecs.sh
      - name: Product certification contracts
        working-directory: tools/pokemap_product_certification
        run: |
          flutter pub get
          flutter test
          flutter analyze
      - name: Gameplay roadmap structure and receipt schema (migration mode)
        working-directory: packages/map_core
        run: |
          dart pub get
          dart test test/gameplay_roadmap_dashboard_test.dart
          # Strict freshness consumes post-checkout receipts from a CI artifact
          # directory. Until every historical DONE lot is migrated, this lane
          # validates structure without pretending to certify freshness.
          dart run tool/generate_gameplay_roadmap_dashboard.dart \
            --check \
            --candidate-sha "$GITHUB_SHA" \
            ../..

  map-editor-quality:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Map editor functional lane
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test --no-pub --timeout 2m -r expanded
          flutter analyze --no-pub
      - name: Map editor performance lane
        working-directory: packages/map_editor
        run: |
          for run_number in 1 2 3; do
            echo "Performance process $run_number of 3"
            flutter test --no-pub --timeout 2m -r expanded \
              --tags performance \
              --run-skipped \
              --concurrency=1 \
              test/cinematic_builder_characterization_performance_test.dart \
              test/event_registry_persistence_performance_test.dart \
              test/narrative_event_authoring_snapshot_performance_test.dart \
              test/narrative_event_validation_incremental_performance_test.dart \
              test/narrative_global_search_performance_test.dart \
              test/narrative_large_project_workspace_performance_test.dart
          done

  performance-observation:
    # PERF-RM-00 is collection-only until at least ten comparable historical
    # observations exist. Failures stay visible without becoming release gates.
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Collect bounded pure-Dart AOT receipts
        continue-on-error: true
        env:
          POKEMAP_FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          POKEMAP_FLAME_VERSION: 1.37.0
        run: |
          mkdir -p packages/map_core/build/performance
          cd packages/map_core
          dart pub get
          dart compile exe benchmark/smart_tiles_rich_map_scaling.dart \
            -o build/performance/smart_tiles_rich_map_scaling
          build/performance/smart_tiles_rich_map_scaling \
            --warmups 1 --samples 5 --extents 128,256,512,1024 \
            --output build/performance/smart_tiles_rich_map_scaling.json
          dart compile exe benchmark/group_hierarchy_scaling.dart \
            -o build/performance/group_hierarchy_scaling
          build/performance/group_hierarchy_scaling \
            --warmups 1 --samples 5 --sizes 100,400 \
            --output build/performance/group_hierarchy_scaling.json
          dart compile exe benchmark/json_roundtrip_scaling.dart \
            -o build/performance/json_roundtrip_scaling
          build/performance/json_roundtrip_scaling \
            --warmups 1 --samples 5 --bytes 1024,102400,2420033 \
            --output build/performance/json_roundtrip_scaling.json
          cd ../map_gameplay
          dart pub get
          mkdir -p build/performance
          dart compile exe benchmark/world_collision_scaling.dart \
            -o build/performance/world_collision_scaling
          build/performance/world_collision_scaling \
            --warmups 1 --samples 5 --sizes 32,128,256 \
            --isolated-size 512 --isolated-runs 3 \
            --output build/performance/world_collision_scaling.json
          cd ../map_authoring
          dart pub get
          mkdir -p build/performance
          dart compile exe benchmark/authoring_snapshot_open.dart \
            -o build/performance/authoring_snapshot_open
          build/performance/authoring_snapshot_open \
            --warmups 1 --samples 5 --fixtures small,selbrume \
            --roots 1,3 --cycles 1 \
            --output build/performance/authoring_snapshot_open.json
          dart compile exe benchmark/smart_tiles_rich_authoring_scaling.dart \
            -o build/performance/smart_tiles_rich_authoring_scaling
          build/performance/smart_tiles_rich_authoring_scaling \
            --warmups 1 --samples 5 --recovery-samples 1 \
            --extents 128,256,512,1024 \
            --output build/performance/smart_tiles_rich_authoring_scaling.json
          cd ../map_battle
          dart pub get
          mkdir -p build/performance
          dart compile exe benchmark/battle_turn_baseline.dart \
            -o build/performance/battle_turn_baseline
          build/performance/battle_turn_baseline \
            --warmups 1 --samples 5 --turns 100,500 \
            --output build/performance/battle_turn_baseline.json
      - name: Verify the explicit collector test manifest
        continue-on-error: true
        run: |
          cd packages/map_core
          dart test \
            test/benchmark/smart_tiles_rich_map_scaling_cli_test.dart \
            test/benchmark/group_hierarchy_scaling_cli_test.dart \
            test/benchmark/json_roundtrip_scaling_cli_test.dart
          cd ../map_gameplay
          dart test test/benchmark/world_collision_scaling_cli_test.dart
          cd ../map_authoring
          dart test \
            test/benchmark/authoring_snapshot_open_cli_test.dart \
            test/benchmark/smart_tiles_rich_authoring_scaling_cli_test.dart
          cd ../map_battle
          dart test test/benchmark/battle_turn_baseline_cli_test.dart
          cd ../../examples/playable_runtime_host
          flutter pub get
          flutter test \
            test/evaluation/interactive_frame_metrics_test.dart \
            test/evaluation/interactive_worker_client_test.dart \
            test/evaluation/pokemap_eval_cli_test.dart
      - name: Collect editor profile journey
        continue-on-error: true
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_project_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_canvas_projection_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_canvas_projection_journey.json
      - name: Preserve performance observation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-performance-observation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            packages/map_core/build/performance/*.json
            packages/map_gameplay/build/performance/*.json
            packages/map_authoring/build/performance/*.json
            packages/map_battle/build/performance/*.json
            packages/map_editor/build/performance/*.json
            examples/playable_runtime_host/build/performance/*.json

  windows-desktop-certification:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$env:RUNNER_TEMP/flutter" fetch --depth 1 origin `
            "refs/tags/$env:FLUTTER_VERSION`:refs/tags/$env:FLUTTER_VERSION"
          git -C "$env:RUNNER_TEMP/flutter" checkout --detach "$env:FLUTTER_VERSION"
          $revision = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($revision -ne "$env:FLUTTER_REVISION") {
            throw "Unexpected Flutter revision: $revision"
          }
          "$env:RUNNER_TEMP/flutter/bin" |
            Out-File -FilePath "$env:GITHUB_PATH" -Encoding utf8 -Append
      - name: Build and launch Windows release
        working-directory: apps/pokemap_hub
        shell: pwsh
        run: |
          flutter pub get
          flutter test test/release/desktop_platform_release_gate_test.dart
          flutter analyze
          flutter build windows --release
          $executable = "build/windows/x64/runner/Release/pokemap_hub.exe"
          if (-not (Test-Path $executable)) {
            throw "Windows release executable is missing: $executable"
          }
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "PokeMap Hub exited during the Windows launch smoke test."
          }
          Stop-Process -Id $process.Id
          $process.WaitForExit()

  linux-desktop-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            xvfb
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and launch Linux release
        working-directory: apps/pokemap_hub
        run: |
          flutter pub get
          flutter test test/release/desktop_platform_release_gate_test.dart
          flutter analyze
          flutter build linux --release
          EXECUTABLE="build/linux/x64/release/bundle/pokemap_hub"
          test -x "$EXECUTABLE"
          xvfb-run --auto-servernum "$EXECUTABLE" \
            > "$RUNNER_TEMP/linux-launch.log" 2>&1 &
          APP_PID=$!
          sleep 8
          kill -0 "$APP_PID"
          kill "$APP_PID"
          wait "$APP_PID" || true

  notarized-release:
    if: >-
      startsWith(github.ref, 'refs/tags/pokemap-hub-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.notarize)
    needs:
      - verify
      - windows-desktop-certification
      - linux-desktop-certification
    runs-on: macos-15
    timeout-minutes: 60
    environment: pokemap-hub-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Import ephemeral Developer ID identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pokemap-release.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build and sign
        working-directory: apps/pokemap_hub
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          flutter pub get
          flutter build macos --release
          APP_PATH="build/macos/Build/Products/Release/PokeMap Hub.app"
          tool/release/sign_macos_app.sh \
            --app "$APP_PATH" \
            --identity "$DEVELOPER_ID_APPLICATION" \
            --entitlements macos/Runner/Release.entitlements
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/release-entitlements.plist"
          test "$(plutil -extract com.apple.security.app-sandbox raw -o - "$RUNNER_TEMP/release-entitlements.plist")" = "true"
          test "$(plutil -extract com.apple.security.files.user-selected.read-only raw -o - "$RUNNER_TEMP/release-entitlements.plist")" = "true"
          ! plutil -extract com.apple.security.get-task-allow raw -o - "$RUNNER_TEMP/release-entitlements.plist"
          ! plutil -extract com.apple.security.cs.allow-jit raw -o - "$RUNNER_TEMP/release-entitlements.plist"
          ! plutil -extract com.apple.security.cs.disable-library-validation raw -o - "$RUNNER_TEMP/release-entitlements.plist"
          ! plutil -extract com.apple.security.network.client raw -o - "$RUNNER_TEMP/release-entitlements.plist"
      - name: Build neutral certification package
        working-directory: tools/pokemap_product_certification
        run: |
          flutter pub get
          flutter test test/build_neutral_package_artifact_test.dart \
            --dart-define=POKEMAP_CERTIFICATION_OUTPUT="$GITHUB_WORKSPACE/apps/pokemap_hub/build/neutral-certification.avelunegame"
      - name: Notarize, staple and assess
        working-directory: apps/pokemap_hub
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials pokemap-release \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
          tool/release/notarize_macos_release.sh \
            --app "build/macos/Build/Products/Release/PokeMap Hub.app" \
            --dmg build/PokeMapHub.dmg \
            --notary-profile pokemap-release \
            --result-json "$RUNNER_TEMP/notary-result.json" \
            --log-directory "$RUNNER_TEMP/notary-logs"
      - name: Cold-install, relaunch and verify release gate
        working-directory: apps/pokemap_hub
        run: |
          CLEAN_ROOT="$(mktemp -d)"
          MOUNT_POINT="$CLEAN_ROOT/mount"
          INSTALLED_ROOT="$CLEAN_ROOT/Applications"
          CLEAN_HOME="$CLEAN_ROOT/home"
          mkdir -p "$MOUNT_POINT" "$INSTALLED_ROOT" "$CLEAN_HOME"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" build/PokeMapHub.dmg
          ditto "$MOUNT_POINT/PokeMap Hub.app" "$INSTALLED_ROOT/PokeMap Hub.app"
          hdiutil detach "$MOUNT_POINT"
          INSTALLED_APP="$INSTALLED_ROOT/PokeMap Hub.app"
          test ! -e "$CLEAN_ROOT/pokemonProject"
          ! find "$INSTALLED_APP" -type l -exec readlink {} \; | grep -F "$GITHUB_WORKSPACE"
          for RUN in 1 2; do
            HOME="$CLEAN_HOME" sandbox-exec \
              -p '(version 1)(allow default)(deny network*)' \
              "$INSTALLED_APP/Contents/MacOS/PokeMap Hub" \
              > "$RUNNER_TEMP/cold-launch-$RUN.log" 2>&1 &
            APP_PID=$!
            sleep 5
            kill -0 "$APP_PID"
            kill "$APP_PID"
            wait "$APP_PID" || true
          done
          APP_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$INSTALLED_APP/Contents/Info.plist")"
          BUILD_NUMBER="$(plutil -extract CFBundleVersion raw -o - "$INSTALLED_APP/Contents/Info.plist")"
          ARCHITECTURES="$(lipo -archs "$INSTALLED_APP/Contents/MacOS/PokeMap Hub" | jq -R 'split(" ")')"
          DMG_SHA256="$(shasum -a 256 build/PokeMapHub.dmg | cut -d ' ' -f 1)"
          DMG_BYTES="$(stat -f '%z' build/PokeMapHub.dmg)"
          PACKAGE_SHA256="$(shasum -a 256 build/neutral-certification.avelunegame | cut -d ' ' -f 1)"
          NOTARY_ID="$(jq -r '.id' "$RUNNER_TEMP/notary-result.json")"
          jq -n \
            --arg appVersion "$APP_VERSION" \
            --arg buildNumber "$BUILD_NUMBER" \
            --arg artifactSha256 "$DMG_SHA256" \
            --argjson artifactBytes "$DMG_BYTES" \
            --argjson architectures "$ARCHITECTURES" \
            --arg notarySubmissionId "$NOTARY_ID" \
            --arg neutralPackageSha256 "$PACKAGE_SHA256" \
            '{
              schemaVersion: 1,
              bundleId: "app.pokemap.hub",
              appVersion: $appVersion,
              buildNumber: $buildNumber,
              artifactSha256: $artifactSha256,
              artifactBytes: $artifactBytes,
              architectures: $architectures,
              notarySubmissionId: $notarySubmissionId,
              neutralPackageSha256: $neutralPackageSha256,
              repositoryAbsent: true,
              networkDisabled: true,
              signedWithDeveloperId: true,
              hardenedRuntime: true,
              notarized: true,
              stapled: true,
              gatekeeperAccepted: true,
              coldInstalled: true,
              relaunched: true,
              createdAt: (now | todateiso8601)
            }' > build/macos-certification-receipt.json
          dart run tool/release/verify_macos_distribution.dart \
            --dmg build/PokeMapHub.dmg \
            --neutral-package build/neutral-certification.avelunegame \
            --receipt build/macos-certification-receipt.json \
            --notary-profile pokemap-release
      - name: Preserve macOS certification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-hub-macos-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            apps/pokemap_hub/build/PokeMapHub.dmg
            apps/pokemap_hub/build/macos-certification-receipt.json
            ${{ runner.temp }}/notary-result.json
            ${{ runner.temp }}/notary-logs
            ${{ runner.temp }}/cold-launch-*.log
