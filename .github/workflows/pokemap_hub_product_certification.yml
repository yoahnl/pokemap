name: PokeMap product certification

on:
  workflow_dispatch:
    inputs:
      performance_soak_minutes:
        description: Run the editor paint and undo soak for this many minutes
        required: true
        default: 30
        type: number

permissions:
  contents: read

concurrency:
  group: pokemap-hub-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.46.0-0.3.pre
  FLUTTER_REVISION: 677d472756f83c14371dd8cc624387065f3d32a7

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Hub tests and analysis
        working-directory: apps/pokemap_hub
        run: |
          flutter pub get
          flutter test --timeout 2m --exclude-tags visual
          flutter analyze
      - name: Verify intro codecs
        working-directory: apps/pokemap_hub
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          tool/release/verify_intro_codecs.sh
      - name: Product certification contracts
        working-directory: tools/pokemap_product_certification
        run: |
          npm ci --prefix ../pokemap_mcp
          flutter pub get
          flutter test
          flutter analyze
      - name: Gameplay roadmap structure and receipt schema (migration mode)
        working-directory: packages/map_core
        run: |
          dart pub get
          dart test test/gameplay_roadmap_dashboard_test.dart
          # Strict freshness consumes post-checkout receipts from a CI artifact
          # directory. Until every historical DONE lot is migrated, this lane
          # validates structure without pretending to certify freshness.
          dart run tool/generate_gameplay_roadmap_dashboard.dart \
            --check \
            --candidate-sha "$GITHUB_SHA" \
            ../..

  domain-golden-gates:
    # BETA-SYS-007. Les Golden Gates de domaine vivent dans packages/, et
    # AUCUNE lane ne les exécutait : le combat, le plus gros domaine de la
    # bêta, ne tournait jamais en CI. Cette lane exécute exactement les
    # fichiers déclarés par product_certification_domain_gates.dart — un test
    # du registre échoue si l'un d'eux manque ici, donc la CI et le registre
    # ne peuvent pas diverger.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Battle domain gates (map_battle)
        working-directory: packages/map_battle
        run: |
          dart pub get
          dart test \
            test/battle_terminal_invariants_test.dart
      - name: Runtime domain gates (map_runtime)
        working-directory: packages/map_runtime
        run: |
          flutter pub get
          flutter test --timeout 4m \
            test/wild_battle_end_to_end_flow_test.dart \
            test/runtime_battle_ui_matches_kernel_test.dart \
            test/trainer_spot_sequence_test.dart \
            test/p3_scenario_runtime_golden_path_test.dart \
            test/p5_beta_runtime_smoke_test.dart \
            test/p5_gameplay_save_load_beta_roundtrip_test.dart \
            test/runtime_failure_taxonomy_test.dart
      - name: Core domain gates (map_core)
        working-directory: packages/map_core
        run: |
          dart pub get
          dart test \
            test/beta_playability_composition_test.dart \
            test/gameplay_roadmap_dashboard_cli_test.dart \
            test/pokemon_catalog_coherence_validator_test.dart
      - name: Editor domain gates (map_editor)
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test --timeout 4m \
            test/import_pokemon_catalog_json_use_case_test.dart

  map-editor-functional-quality:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Map editor functional lane
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test --no-pub --timeout 2m -r expanded
          flutter analyze --no-pub

  map-editor-performance-quality:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Map editor performance lane
        working-directory: packages/map_editor
        run: |
          flutter pub get
          for run_number in 1 2 3; do
            echo "Performance process $run_number of 3"
            flutter test --no-pub --timeout 2m -r expanded \
              --tags performance \
              --run-skipped \
              --concurrency=1 \
              test/cinematic_builder_characterization_performance_test.dart \
              test/event_registry_persistence_performance_test.dart \
              test/narrative_event_authoring_snapshot_performance_test.dart \
              test/narrative_event_validation_incremental_performance_test.dart \
              test/narrative_global_search_performance_test.dart \
              test/narrative_large_project_workspace_performance_test.dart
          done

  map-editor-performance-gate:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify editor performance receipt contracts
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test --no-pub \
            test/performance_driver_contract_test.dart \
            test/perf_009_project_performance_driver_test.dart \
            test/fine_mask_performance_contract_test.dart
      - name: Run sequential editor profile gates
        working-directory: packages/map_editor
        run: |
          mkdir -p build/performance
          flutter drive --profile -d macos \
            --driver=test_driver/perf_009_project_performance_driver.dart \
            --target=integration_test/editor_project_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_canvas_projection_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_canvas_projection_journey.json
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_performance_soak_journey_test.dart \
            --dart-define=POKEMAP_PERF_SOAK_MINUTES=${{ inputs.performance_soak_minutes || 0 }} \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_performance_soak_journey.json
          flutter drive --profile -d macos \
            --driver=test_driver/fine_mask_performance_driver.dart \
            --target=integration_test/editor_fine_mask_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_fine_mask_journey.json
      - name: Preserve blocking editor performance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-editor-performance-gate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            packages/map_editor/build/performance/editor_project_journey.json
            packages/map_editor/build/performance/editor_canvas_projection_journey.json
            packages/map_editor/build/performance/editor_performance_soak_journey.json
            packages/map_editor/build/performance/editor_fine_mask_journey.json

  performance-observation:
    needs: map-editor-performance-gate
    if: github.event_name != 'pull_request'
    # PERF-RM-00 is collection-only until at least ten comparable historical
    # observations exist. Failures stay visible without becoming release gates.
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Collect bounded pure-Dart AOT receipts
        continue-on-error: true
        env:
          POKEMAP_FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          POKEMAP_FLAME_VERSION: 1.37.0
        run: |
          mkdir -p packages/map_core/build/performance
          cd packages/map_core
          dart pub get
          dart compile exe benchmark/smart_tiles_rich_map_scaling.dart \
            -o build/performance/smart_tiles_rich_map_scaling
          build/performance/smart_tiles_rich_map_scaling \
            --warmups 1 --samples 5 --extents 128,256,512,1024 \
            --output build/performance/smart_tiles_rich_map_scaling.json
          dart compile exe benchmark/group_hierarchy_scaling.dart \
            -o build/performance/group_hierarchy_scaling
          build/performance/group_hierarchy_scaling \
            --warmups 1 --samples 5 --sizes 100,400 \
            --output build/performance/group_hierarchy_scaling.json
          dart compile exe benchmark/json_roundtrip_scaling.dart \
            -o build/performance/json_roundtrip_scaling
          build/performance/json_roundtrip_scaling \
            --warmups 1 --samples 5 --bytes 1024,102400,2420033 \
            --output build/performance/json_roundtrip_scaling.json
          cd ../map_gameplay
          dart pub get
          mkdir -p build/performance
          dart compile exe benchmark/world_collision_scaling.dart \
            -o build/performance/world_collision_scaling
          build/performance/world_collision_scaling \
            --warmups 1 --samples 5 --sizes 32,128,256 \
            --isolated-size 512 --isolated-runs 3 \
            --output build/performance/world_collision_scaling.json
          cd ../map_authoring
          dart pub get
          mkdir -p build/performance
          dart compile exe benchmark/authoring_snapshot_open.dart \
            -o build/performance/authoring_snapshot_open
          build/performance/authoring_snapshot_open \
            --warmups 1 --samples 5 --fixtures small,selbrume \
            --roots 1,3 --cycles 1 \
            --output build/performance/authoring_snapshot_open.json
          dart compile exe benchmark/smart_tiles_rich_authoring_scaling.dart \
            -o build/performance/smart_tiles_rich_authoring_scaling
          build/performance/smart_tiles_rich_authoring_scaling \
            --warmups 1 --samples 5 --recovery-samples 1 \
            --extents 128,256,512,1024 \
            --output build/performance/smart_tiles_rich_authoring_scaling.json
          cd ../map_battle
          dart pub get
          mkdir -p build/performance
          dart compile exe benchmark/battle_turn_baseline.dart \
            -o build/performance/battle_turn_baseline
          build/performance/battle_turn_baseline \
            --warmups 1 --samples 5 --turns 100,500 \
            --output build/performance/battle_turn_baseline.json
      - name: Verify the explicit collector test manifest
        continue-on-error: true
        run: |
          cd packages/map_core
          dart test \
            test/benchmark/smart_tiles_rich_map_scaling_cli_test.dart \
            test/benchmark/group_hierarchy_scaling_cli_test.dart \
            test/benchmark/json_roundtrip_scaling_cli_test.dart
          cd ../map_gameplay
          dart test test/benchmark/world_collision_scaling_cli_test.dart
          cd ../map_authoring
          mkdir -p build/test
          dart test \
            test/benchmark/authoring_snapshot_open_cli_test.dart \
            test/benchmark/smart_tiles_rich_authoring_scaling_cli_test.dart
          cd ../map_battle
          dart test test/benchmark/battle_turn_baseline_cli_test.dart
          cd ../../examples/playable_runtime_host
          flutter pub get
          flutter test \
            test/evaluation/interactive_frame_metrics_test.dart \
            test/evaluation/interactive_worker_client_test.dart \
            test/evaluation/pokemap_eval_cli_test.dart
      - name: Collect bounded editor history receipt
        continue-on-error: true
        working-directory: packages/map_editor
        run: |
          flutter pub get
          dart run benchmark/map_history_delta_scaling.dart \
            --warmups 1 --samples 5 --entries 10000 --operations 10000 \
            --tile-extent 1024 \
            --output build/performance/map_history_delta_scaling.json
          flutter test --no-pub \
            test/benchmark/map_history_delta_scaling_cli_test.dart
      - name: Collect editor profile journey
        continue-on-error: true
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter drive --profile -d macos \
            --driver=test_driver/perf_009_project_performance_driver.dart \
            --target=integration_test/editor_project_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_canvas_projection_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_canvas_projection_journey.json
          flutter drive --profile -d macos \
            --driver=test_driver/fine_mask_performance_driver.dart \
            --target=integration_test/editor_fine_mask_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_fine_mask_journey.json
      - name: Collect Personalization Studio profile journey
        continue-on-error: true
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/personalization_performance_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/personalization_studio_journey.json
      - name: Preserve performance observation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-performance-observation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            packages/map_core/build/performance/*.json
            packages/map_gameplay/build/performance/*.json
            packages/map_authoring/build/performance/*.json
            packages/map_battle/build/performance/*.json
            packages/map_editor/build/performance/*.json
            examples/playable_runtime_host/build/performance/*.json
