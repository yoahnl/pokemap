name: BETA-PERF-009 final certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-perf-009-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.46.0-0.3.pre
  FLUTTER_REVISION: 677d472756f83c14371dd8cc624387065f3d32a7

jobs:
  perf-009-certification:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout exact certification SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checked-out SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Install pinned Flutter SDK
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify PERF-009 contracts
        working-directory: packages/map_editor
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub \
            test/performance_driver_contract_test.dart \
            test/fine_mask_performance_contract_test.dart \
            test/perf_009_project_performance_driver_test.dart
          flutter analyze --no-pub \
            integration_test/editor_project_journey_test.dart \
            test_driver/perf_009_project_performance_driver.dart \
            test/perf_009_project_performance_driver_test.dart

      - name: Run project journey gate
        working-directory: packages/map_editor
        run: |
          set -euo pipefail
          mkdir -p build/performance
          flutter drive --profile -d macos \
            --driver=test_driver/perf_009_project_performance_driver.dart \
            --target=integration_test/editor_project_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json \
            2>&1 | tee build/performance/editor_project_journey.log

      - name: Run canvas projection gate
        working-directory: packages/map_editor
        run: |
          set -euo pipefail
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_canvas_projection_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_canvas_projection_journey.json \
            2>&1 | tee build/performance/editor_canvas_projection_journey.log

      - name: Run 30 minute soak A/C gate
        working-directory: packages/map_editor
        run: |
          set -euo pipefail
          flutter drive --profile -d macos \
            --driver=test_driver/performance_driver.dart \
            --target=integration_test/editor_performance_soak_journey_test.dart \
            --dart-define=POKEMAP_PERF_SOAK_MINUTES=30 \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_performance_soak_journey.json \
            2>&1 | tee build/performance/editor_performance_soak_journey.log

      - name: Run fine-mask B gate
        working-directory: packages/map_editor
        run: |
          set -euo pipefail
          flutter drive --profile -d macos \
            --driver=test_driver/fine_mask_performance_driver.dart \
            --target=integration_test/editor_fine_mask_journey_test.dart \
            --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_fine_mask_journey.json \
            2>&1 | tee build/performance/editor_fine_mask_journey.log

      - name: Verify production tree remained clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Preserve PERF-009 receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-perf-009-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            packages/map_editor/build/performance/editor_project_journey.json
            packages/map_editor/build/performance/editor_canvas_projection_journey.json
            packages/map_editor/build/performance/editor_performance_soak_journey.json
            packages/map_editor/build/performance/editor_fine_mask_journey.json
            packages/map_editor/build/performance/editor_project_journey.log
            packages/map_editor/build/performance/editor_canvas_projection_journey.log
            packages/map_editor/build/performance/editor_performance_soak_journey.log
            packages/map_editor/build/performance/editor_fine_mask_journey.log
