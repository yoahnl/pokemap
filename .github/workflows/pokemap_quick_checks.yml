name: PokeMap quick checks

on:
  pull_request:
    paths:
      - "apps/Avelune iOS/**"
      - "apps/avelune_android/**"
      - "apps/avelune_version.xcconfig"
      - "apps/avelune_studio/**"
      - "packages/**"
      - "examples/playable_runtime_host/**"
      - "tools/pokemap_mcp/scripts/pmcp085_release_gate.sh"
      - "tools/pokemap_product_certification/**"
      - "tools/release/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "apps/Avelune iOS/**"
      - "apps/avelune_android/**"
      - "apps/avelune_version.xcconfig"
      - "apps/avelune_studio/**"
      - "packages/**"
      - "examples/playable_runtime_host/**"
      - "tools/pokemap_mcp/scripts/pmcp085_release_gate.sh"
      - "tools/pokemap_product_certification/**"
      - "tools/release/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pokemap-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.48.0-0.4.pre
  FLUTTER_REVISION: e3005e3402d9cfa2043114c8bc53c59d12e9b98e

jobs:
  repository-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Native host ownership contracts
        run: |
          python3 -m unittest discover \
            -s apps/avelune_android/tool \
            -p 'test_native_host_contracts.py' -v
      - name: Core roadmap contracts
        working-directory: packages/map_core
        run: |
          dart pub get
          dart test \
            test/save/avelune_compatibility_baseline_save_test.dart \
            test/gameplay_roadmap_dashboard_test.dart \
            test/gameplay_roadmap_dashboard_cli_test.dart \
            test/gameplay_roadmap_repository_consistency_test.dart
          dart analyze \
            test/save/avelune_compatibility_baseline_save_test.dart \
            lib/src/tooling/gameplay_roadmap_dashboard.dart \
            tool/generate_gameplay_roadmap_dashboard.dart \
            test/gameplay_roadmap_dashboard_test.dart \
            test/gameplay_roadmap_dashboard_cli_test.dart \
            test/gameplay_roadmap_repository_consistency_test.dart
      - name: Story engine contracts
        working-directory: packages/map_story
        timeout-minutes: 3
        run: |
          dart pub get
          dart analyze
          dart test \
            test/map_story_dependency_boundary_test.dart \
            test/scene_runtime_compilation_check_parity_test.dart \
            test/scene_execution_context_test.dart \
            test/scene_runtime_plan_test.dart \
            test/scene_runtime_executor_test.dart \
            test/scene_runtime_dry_run_preview_test.dart \
            test/scene_structured_interaction_port_test.dart \
            test/narrative_event_dispatch_planner_test.dart \
            test/narrative_event_condition_eligibility_test.dart \
            test/narrative_event_dispatch_truth_table_test.dart \
            test/narrative_event_execution_coordinator_test.dart \
            test/narrative_event_lifecycle_test.dart \
            test/narrative_event_transaction_concurrency_test.dart \
            test/narrative_outcome_outbox_processor_test.dart \
            test/narrative_outcome_outbox_reentrancy_test.dart \
            test/narrative_outcome_outbox_retry_test.dart \
            test/narrative_parallel_scheduler_test.dart \
            test/narrative_trigger_enter_fronts_test.dart
      - name: Avelune package compatibility baseline
        working-directory: packages/map_distribution
        timeout-minutes: 2
        run: |
          dart pub get
          dart test \
            test/avelune_runtime_compatibility_test.dart \
            test/avelune_compatibility_baseline_package_test.dart \
            test/game_package_compatibility_test.dart \
            test/game_package_builder_test.dart
      - name: Avelune Player save and resume
        working-directory: packages/map_runtime
        timeout-minutes: 2
        run: |
          flutter pub get
          flutter test --no-pub --no-test-assets --timeout 2m \
            test/file_game_save_repository_test.dart \
            test/game_save_load_diagnostics_test.dart \
            test/player/runtime_player_save_race_test.dart
      - name: Authoring release gate syntax
        run: bash -n tools/pokemap_mcp/scripts/pmcp085_release_gate.sh
      - name: Studio smoke and static checks
        working-directory: apps/avelune_studio
        run: |
          flutter pub get
          flutter test --no-pub --timeout 2m \
            test/release/ci_cost_workflow_test.dart \
            test/release/performance_observation_workflow_test.dart \
            test/app/studio_bootstrap_test.dart \
            test/home/recent_projects_test.dart \
            test/map_workspace/map_editing_input_session_test.dart \
            test/project_session/scoped_project_session_adapter_test.dart \
            test/presentation/studio_app_test.dart \
            test/presentation/map_builder_gameplay_test.dart
          flutter analyze --no-pub lib
