name: PokeMap quick checks

on:
  pull_request:
    paths:
      - "apps/Avelune iOS/**"
      - "apps/avelune_android/**"
      - "apps/avelune_version.xcconfig"
      - "apps/pokemap_hub/lib/**"
      - "apps/pokemap_hub/test/features/saves/avelune_compatibility_baseline_continue_test.dart"
      - "apps/pokemap_hub/test/platform/avelune_host_compatibility_test.dart"
      - "apps/pokemap_hub/test/features/session/hub_player_save_gateway_test.dart"
      - "apps/avelune_studio/**"
      - "packages/**"
      - "examples/playable_runtime_host/**"
      - "tools/pokemap_product_certification/**"
      - "tools/release/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "apps/Avelune iOS/**"
      - "apps/avelune_android/**"
      - "apps/avelune_version.xcconfig"
      - "apps/pokemap_hub/lib/**"
      - "apps/pokemap_hub/test/features/saves/avelune_compatibility_baseline_continue_test.dart"
      - "apps/pokemap_hub/test/platform/avelune_host_compatibility_test.dart"
      - "apps/pokemap_hub/test/features/session/hub_player_save_gateway_test.dart"
      - "apps/avelune_studio/**"
      - "packages/**"
      - "examples/playable_runtime_host/**"
      - "tools/pokemap_product_certification/**"
      - "tools/release/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pokemap-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.48.0-0.4.pre
  FLUTTER_REVISION: e3005e3402d9cfa2043114c8bc53c59d12e9b98e

jobs:
  repository-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Native host ownership contracts
        run: |
          python3 -m unittest discover \
            -s apps/avelune_android/tool \
            -p 'test_native_host_contracts.py' -v
      - name: Core roadmap contracts
        working-directory: packages/map_core
        run: |
          dart pub get
          dart test \
            test/save/avelune_compatibility_baseline_save_test.dart \
            test/gameplay_roadmap_dashboard_test.dart \
            test/gameplay_roadmap_dashboard_cli_test.dart \
            test/gameplay_roadmap_repository_consistency_test.dart
          dart analyze \
            test/save/avelune_compatibility_baseline_save_test.dart \
            lib/src/tooling/gameplay_roadmap_dashboard.dart \
            tool/generate_gameplay_roadmap_dashboard.dart \
            test/gameplay_roadmap_dashboard_test.dart \
            test/gameplay_roadmap_dashboard_cli_test.dart \
            test/gameplay_roadmap_repository_consistency_test.dart
      - name: Avelune package compatibility baseline
        working-directory: packages/map_distribution
        timeout-minutes: 2
        run: |
          dart pub get
          dart test \
            test/avelune_runtime_compatibility_test.dart \
            test/avelune_compatibility_baseline_package_test.dart \
            test/game_package_compatibility_test.dart \
            test/game_package_builder_test.dart
      - name: Avelune save compatibility baseline
        working-directory: apps/pokemap_hub
        timeout-minutes: 2
        run: |
          flutter pub get
          flutter test --no-pub --no-test-assets --timeout 2m \
            test/platform/avelune_host_compatibility_test.dart \
            test/features/saves/avelune_compatibility_baseline_continue_test.dart \
            test/features/session/hub_player_save_gateway_test.dart
      - name: Editor smoke and static checks
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test --no-pub --timeout 2m \
            test/release/github_distribution_workflow_test.dart \
            test/tileset_grid_metrics_test.dart \
            test/map_editing_controller_test.dart
          flutter analyze --no-pub lib test/release
      - name: Studio smoke and static checks
        working-directory: apps/avelune_studio
        run: |
          flutter pub get
          flutter test --no-pub --timeout 2m \
            test/release/ci_cost_workflow_test.dart \
            test/release/performance_observation_workflow_test.dart \
            test/app/studio_bootstrap_test.dart \
            test/home/recent_projects_test.dart \
            test/project_session/scoped_project_session_adapter_test.dart \
            test/presentation/studio_app_test.dart \
            test/map_workspace/map_tool_strip_state_host_test.dart
          flutter analyze --no-pub lib
