name: Avelune Converter macOS distribution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate a signed installer or publish a stable version
        type: choice
        options: [preflight, release]
        default: preflight
        required: true
      version:
        description: Stable version matching Converter pubspec, required for release
        type: string
      confirmation:
        description: Type RELEASE to publish
        type: string

permissions:
  contents: read

concurrency:
  group: avelune-converter-stable-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.48.0-0.4.pre
  FLUTTER_REVISION: e3005e3402d9cfa2043114c8bc53c59d12e9b98e
  STABLE_TAG: avelune-converter-update-stable

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.contract.outputs.version }}
      build: ${{ steps.contract.outputs.build }}
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify release tooling
        run: |
          python3 -m unittest discover -s apps/avelune_converter/tool -p 'test_release*.py'
          python3 -m unittest discover -s apps/avelune_converter/tool -p 'test_verify_sparkle.py'
          bash -n apps/avelune_converter/tool/build_macos_release.sh
      - name: Validate release identity and monotonic stable version
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yoahnl/pokemap
          test "$GITHUB_REF" = refs/heads/main
          previous_args=()
          if [[ "$MODE" == release ]]; then
            test "$CONFIRMATION" = RELEASE
            test -n "$REQUESTED_VERSION"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" > "$RUNNER_TEMP/stable.json" 2> "$RUNNER_TEMP/stable.err"; then
              if [[ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["draft"])' "$RUNNER_TEMP/stable.json")" = True ]]; then
                test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_commitish"])' "$RUNNER_TEMP/stable.json")" = "$GITHUB_SHA"
              else
                gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" \
                  --pattern avelune-converter-update-index.json --dir "$RUNNER_TEMP/previous"
                previous_args=(--previous "$RUNNER_TEMP/previous/avelune-converter-update-index.json" --allow-identical)
              fi
            elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/stable.err"; then
              cat "$RUNNER_TEMP/stable.err" >&2
              exit 1
            fi
          fi
          python3 apps/avelune_converter/tool/release_metadata.py contract \
            --pubspec apps/avelune_converter/pubspec.yaml --revision "$GITHUB_SHA" \
            --version "$REQUESTED_VERSION" "${previous_args[@]}" --output "$RUNNER_TEMP/contract.json"
          python3 - "$RUNNER_TEMP/contract.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          print('version=' + c['version'])
          print('build=' + str(c['buildNumber']))
          print('tag=' + c['tag'])
          PY
          if [[ "$MODE" == release ]]; then
            tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/contract.json")"
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > "$RUNNER_TEMP/tag.txt"
            result=$?
            set -e
            if [[ "$result" = 0 ]]; then
              test "$(cut -f1 "$RUNNER_TEMP/tag.txt")" = "$GITHUB_SHA"
            else
              test "$result" = 2 || { echo 'Refusing an unverifiable remote.' >&2; exit 65; }
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-release-contract
          path: ${{ runner.temp }}/contract.json
          retention-days: 7

  macos:
    needs: validate
    runs-on: macos-15
    environment: pokemap-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: converter-release-contract
          path: ${{ runner.temp }}/contract
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and analyze Converter
        working-directory: apps/avelune_converter
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build }}
        run: |
          flutter pub get
          flutter test --concurrency=1
          flutter test ../avelune_studio/test/release/macos_notarization_script_test.dart --concurrency=1
          flutter analyze
          flutter test test/converter_build_identity_test.dart --plain-name 'release flags reach the running build identity' \
            --dart-define="AVELUNE_CONVERTER_VERSION=$RELEASE_VERSION" \
            --dart-define="AVELUNE_CONVERTER_BUILD_NUMBER=$RELEASE_BUILD" \
            --dart-define="AVELUNE_CONVERTER_REVISION=$GITHUB_SHA" \
            --dart-define="TEST_RELEASE_VERSION=$RELEASE_VERSION" \
            --dart-define="TEST_RELEASE_BUILD_NUMBER=$RELEASE_BUILD" \
            --dart-define="TEST_RELEASE_REVISION=$GITHUB_SHA"
      - name: Build, sign, notarize and verify update
        working-directory: apps/avelune_converter
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY }}
          AVELUNE_CONVERTER_SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.AVELUNE_CONVERTER_SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: bash tool/build_macos_release.sh "$RUNNER_TEMP/contract/contract.json" "$RUNNER_TEMP/distribution"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avelune-converter-macos-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve notarization diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-notarization-${{ github.run_id }}
          path: ${{ runner.temp }}/converter-notary-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: inputs.mode == 'release'
    needs: [validate, macos]
    runs-on: ubuntu-24.04
    environment: pokemap-release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: avelune-converter-macos-${{ needs.validate.outputs.version }}
          path: distribution
      - name: Verify immutable release payload
        run: |
          python3 apps/avelune_converter/tool/release_metadata.py verify --directory distribution
          python3 apps/avelune_converter/tool/verify_sparkle.py --directory distribution \
            --public-key "$AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY"
          test "$(python3 -c 'import json; print(json.load(open("distribution/avelune-converter-update-index.json"))["revision"])')" = "$GITHUB_SHA"
      - name: Create versioned draft or resume exact immutable payload
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing.json" 2> "$RUNNER_TEMP/existing.err"; then
            test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_commitish"])' "$RUNNER_TEMP/existing.json")" = "$GITHUB_SHA"
            mkdir existing
            if [[ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["assets"]))' "$RUNNER_TEMP/existing.json")" != 0 ]]; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing
            fi
            shopt -s nullglob
            for asset in existing/*; do
              test -f "distribution/$(basename "$asset")"
              cmp "$asset" "distribution/$(basename "$asset")"
            done
            for asset in distribution/*; do
              if [[ ! -f "existing/$(basename "$asset")" ]]; then
                test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["draft"])' "$RUNNER_TEMP/existing.json")" = True
                gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$asset"
              fi
            done
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/existing.err" || { cat "$RUNNER_TEMP/existing.err" >&2; exit 1; }
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "Avelune Converter $RELEASE_VERSION" \
              --notes 'Application macOS du convertisseur Avelune. Ouvrir le DMG et déplacer Avelune Converter dans Applications. Les mises à jour sont proposées dans l’application.' \
              distribution/*
          fi
      - name: Download draft assets and verify them again
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          python3 apps/avelune_converter/tool/release_metadata.py verify --directory downloaded
          python3 apps/avelune_converter/tool/verify_sparkle.py --directory downloaded \
            --public-key "$AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY"
          diff -r distribution downloaded
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
      - name: Publish verified immutable release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Verify public versioned download URLs before promotion
        run: |
          mkdir public
          for asset in distribution/*; do
            name="$(basename "$asset")"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name" --output "public/$name"
            cmp "$asset" "public/$name"
          done
          python3 apps/avelune_converter/tool/release_metadata.py verify --directory public
          python3 apps/avelune_converter/tool/verify_sparkle.py --directory public \
            --public-key "$AVELUNE_CONVERTER_SPARKLE_PUBLIC_ED_KEY"
      - name: Promote Converter stable feed after release verification
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" > "$RUNNER_TEMP/stable.json" 2> "$RUNNER_TEMP/stable.err"; then
            if [[ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["draft"])' "$RUNNER_TEMP/stable.json")" = True ]]; then
              test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_commitish"])' "$RUNNER_TEMP/stable.json")" = "$GITHUB_SHA"
              if [[ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["assets"]))' "$RUNNER_TEMP/stable.json")" != 0 ]]; then
                gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/partial-stable"
                for asset in "$RUNNER_TEMP/partial-stable/"*; do
                  name="$(basename "$asset")"
                  [[ "$name" = appcast-macos.xml || "$name" = avelune-converter-update-index.json ]]
                  cmp "$asset" "public/$name"
                done
              fi
            else
              gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern avelune-converter-update-index.json --dir "$RUNNER_TEMP/before-promotion"
              python3 apps/avelune_converter/tool/release_metadata.py promotion --directory public \
                --previous "$RUNNER_TEMP/before-promotion/avelune-converter-update-index.json"
            fi
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/stable.err" || { cat "$RUNNER_TEMP/stable.err" >&2; exit 1; }
            gh release create "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title 'Avelune Converter stable update feed' --notes 'Signed Converter update metadata.' --latest=false
          fi
          gh release upload "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --clobber public/appcast-macos.xml
          gh release upload "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --clobber public/avelune-converter-update-index.json
          gh release edit "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Verify public stable feed bytes
        run: |
          for name in appcast-macos.xml avelune-converter-update-index.json; do
            matched=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --location --silent --show-error \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$STABLE_TAG/$name" --output "$RUNNER_TEMP/$name" \
                && cmp --silent "public/$name" "$RUNNER_TEMP/$name"; then matched=true; break; fi
              sleep 2
            done
            test "$matched" = true
          done
