name: PokeMap desktop distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/map_core/**"
      - "packages/map_distribution/**"
      - "packages/map_editor/**"
      - "packages/map_gameplay/**"
      - "packages/map_runtime/**"
      - "apps/pokemap_hub/tool/release/notarize_macos_release.sh"
      - "apps/pokemap_hub/tool/release/sign_macos_app.sh"
      - ".github/workflows/pokemap_desktop_release.yml"
  push:
    branches: [main]
    tags: ["pokemap-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/pokemap-v') && 'pokemap-desktop-stable-release' || format('pokemap-desktop-{0}', github.ref) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.46.0-0.3.pre
  FLUTTER_REVISION: 677d472756f83c14371dd8cc624387065f3d32a7

jobs:
  validate-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release-contract.outputs.version }}
      build_number: ${{ steps.release-contract.outputs.build_number }}
      tag: ${{ steps.release-contract.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Validate release tag and build
        id: release-contract
        working-directory: packages/map_editor
        run: |
          flutter pub get
          dart run tool/release/validate_release_version.dart --tag "$GITHUB_REF_NAME" --pubspec pubspec.yaml --github-output "$GITHUB_OUTPUT"

  macos-preview:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/pokemap-v') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and build macOS preview
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build macos --release
          tool/release/package_macos_preview.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --dmg build/release/PokeMap-macos-preview.dmg
      - name: Preserve macOS preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-macos-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: packages/map_editor/build/release/PokeMap-macos-preview.dmg

  macos-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: pokemap-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Read preflight version
        working-directory: packages/map_editor
        run: |
          RELEASE_VERSION="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          RELEASE_BUILD_NUMBER="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          test -n "$RELEASE_VERSION"
          test -n "$RELEASE_BUILD_NUMBER"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Import ephemeral Developer ID identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pokemap-release.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build and sign PokeMap preflight
        working-directory: packages/map_editor
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          POKEMAP_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.POKEMAP_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$DEVELOPER_ID_APPLICATION"
          test -n "$POKEMAP_SPARKLE_PUBLIC_ED_KEY"
          SPARKLE_PUBLIC_KEY_BYTES="$(
            printf '%s' "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" | base64 --decode | wc -c | tr -d ' '
          )"
          test "$SPARKLE_PUBLIC_KEY_BYTES" = 32
          flutter pub get
          flutter test test/release test/features/editor_updates/native_update_phase3_contract_test.dart
          flutter analyze
          flutter build macos --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER"
          APP_PATH="build/macos/Build/Products/Release/PokeMap.app"
          plutil -replace SUPublicEDKey -string "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" \
            "$APP_PATH/Contents/Info.plist"
          test "$(plutil -extract SUPublicEDKey raw "$APP_PATH/Contents/Info.plist")" = \
            "$POKEMAP_SPARKLE_PUBLIC_ED_KEY"
          test "$(plutil -extract SURequireSignedFeed raw "$APP_PATH/Contents/Info.plist")" = true
          test "$(plutil -extract SUVerifyUpdateBeforeExtraction raw "$APP_PATH/Contents/Info.plist")" = true
          ../../apps/pokemap_hub/tool/release/sign_macos_app.sh \
            --app "$APP_PATH" \
            --identity "$DEVELOPER_ID_APPLICATION" \
            --entitlements macos/Runner/Release.entitlements
      - name: Notarize, staple and assess preflight
        working-directory: packages/map_editor
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials pokemap-release \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
          ../../apps/pokemap_hub/tool/release/notarize_macos_release.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --dmg "build/release/PokeMap-Editor-$RELEASE_VERSION-macOS.dmg" \
            --notary-profile pokemap-release \
            --result-json "$RUNNER_TEMP/notary-result.json" \
            --log-directory "$RUNNER_TEMP/notary-logs" \
            --volume-name PokeMap
      - name: Generate signed Sparkle preflight
        working-directory: packages/map_editor
        env:
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY_BASE64"
          PRIVATE_KEY="$RUNNER_TEMP/sparkle-private.key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY_BASE64" | base64 --decode > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"
          GENERATE_APPCAST="$(find build/macos -type f \
            -path '*/Sparkle/bin/generate_appcast' -perm -111 -print -quit)"
          test -n "$GENERATE_APPCAST"
          tool/release/package_macos_update.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --version "$RELEASE_VERSION" \
            --output-dir build/release \
            --generate-appcast "$GENERATE_APPCAST" \
            --private-key-file "$PRIVATE_KEY" \
            --download-url-prefix \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/pokemap-v$RELEASE_VERSION/"
          grep -q '<!-- sparkle-signatures:' build/release/appcast-macos.xml
      - name: Preserve macOS preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-macos-preflight-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/map_editor/build/release/PokeMap-Editor-*-macOS.dmg
            packages/map_editor/build/release/PokeMap-Editor-*-macOS.app.zip
            packages/map_editor/build/release/appcast-macos.xml

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/pokemap-v') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$env:RUNNER_TEMP/flutter" fetch --depth 1 origin `
            "refs/tags/$env:FLUTTER_VERSION`:refs/tags/$env:FLUTTER_VERSION"
          git -C "$env:RUNNER_TEMP/flutter" checkout --detach "$env:FLUTTER_VERSION"
          $revision = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($revision -ne "$env:FLUTTER_REVISION") {
            throw "Unexpected Flutter revision: $revision"
          }
          "$env:RUNNER_TEMP/flutter/bin" |
            Out-File -FilePath "$env:GITHUB_PATH" -Encoding utf8 -Append
      - name: Test, build and package Windows
        working-directory: packages/map_editor
        shell: pwsh
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build windows --release
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/PokeMap.exe")) {
            throw "PokeMap Windows executable is missing."
          }
          New-Item -ItemType Directory -Force -Path "build/release" | Out-Null
          Compress-Archive -Path "$bundle/*" `
            -DestinationPath "build/release/PokeMap-windows-x64.zip"
          $versionMatch = [regex]::Match(
            (Get-Content pubspec.yaml -Raw),
            '(?m)^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+\r?$'
          )
          if (-not $versionMatch.Success) {
            throw "pubspec.yaml must contain a stable version and build number."
          }
          ./tool/release/package_windows_manual_release.ps1 `
            -Version $versionMatch.Groups[1].Value `
            -BundleDir $bundle `
            -OutputDir "build/release"
      - name: Preserve Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            packages/map_editor/build/release/PokeMap-windows-x64.zip
            packages/map_editor/build/release/PokeMap-Editor-Setup-*.exe

  windows-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs: validate-release
    runs-on: windows-2025
    timeout-minutes: 60
    environment: pokemap-release
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.validate-release.outputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$env:RUNNER_TEMP/flutter" fetch --depth 1 origin `
            "refs/tags/$env:FLUTTER_VERSION`:refs/tags/$env:FLUTTER_VERSION"
          git -C "$env:RUNNER_TEMP/flutter" checkout --detach "$env:FLUTTER_VERSION"
          $revision = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($revision -ne "$env:FLUTTER_REVISION") {
            throw "Unexpected Flutter revision: $revision"
          }
          "$env:RUNNER_TEMP/flutter/bin" |
            Out-File -FilePath "$env:GITHUB_PATH" -Encoding utf8 -Append
      - name: Build Windows manual release
        working-directory: packages/map_editor
        shell: pwsh
        run: |
          flutter pub get
          flutter test test/release test/features/editor_updates/native_update_phase3_contract_test.dart
          flutter analyze
          flutter build windows --release `
            "--build-name=$env:RELEASE_VERSION" `
            "--build-number=$env:RELEASE_BUILD_NUMBER"
          $bundle = "build/windows/x64/runner/Release"
          foreach ($file in @("PokeMap.exe", "WinSparkle.dll")) {
            if (-not (Test-Path "$bundle/$file")) {
              throw "PokeMap Windows bundle is missing $file."
            }
          }
      - name: Package Windows manual installer
        working-directory: packages/map_editor
        shell: pwsh
        run: |
          ./tool/release/package_windows_manual_release.ps1 `
            -Version $env:RELEASE_VERSION `
            -BundleDir "build/windows/x64/runner/Release" `
            -OutputDir "build/release"
      - name: Preserve Windows manual installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: packages/map_editor/build/release/PokeMap-Editor-Setup-*.exe

  linux-preview:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/pokemap-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test, build and package Linux preview
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build linux --release
          test -x build/linux/x64/release/bundle/pokemap
          mkdir -p build/release
          tar -C build/linux/x64/release/bundle -czf \
            build/release/PokeMap-linux-x64.tar.gz .
      - name: Preserve Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: packages/map_editor/build/release/PokeMap-linux-x64.tar.gz

  linux-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.validate-release.outputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test, build and package versioned Linux release
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build linux --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER"
          test -x build/linux/x64/release/bundle/pokemap
          mkdir -p build/release
          tar -C build/linux/x64/release/bundle -czf \
            "build/release/PokeMap-Editor-$RELEASE_VERSION-linux-x64.tar.gz" .
      - name: Preserve versioned Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: packages/map_editor/build/release/PokeMap-Editor-*-linux-x64.tar.gz

  macos-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs: validate-release
    runs-on: macos-15
    timeout-minutes: 90
    environment: pokemap-release
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.validate-release.outputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Import ephemeral Developer ID identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pokemap-release.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build and sign PokeMap
        working-directory: packages/map_editor
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          POKEMAP_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.POKEMAP_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$DEVELOPER_ID_APPLICATION"
          test -n "$POKEMAP_SPARKLE_PUBLIC_ED_KEY"
          SPARKLE_PUBLIC_KEY_BYTES="$(
            printf '%s' "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" | base64 --decode | wc -c | tr -d ' '
          )"
          test "$SPARKLE_PUBLIC_KEY_BYTES" = 32
          flutter pub get
          flutter test test/release test/features/editor_updates/native_update_phase3_contract_test.dart
          flutter analyze
          flutter build macos --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER"
          APP_PATH="build/macos/Build/Products/Release/PokeMap.app"
          plutil -replace SUPublicEDKey -string "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" \
            "$APP_PATH/Contents/Info.plist"
          test "$(plutil -extract SUPublicEDKey raw "$APP_PATH/Contents/Info.plist")" = \
            "$POKEMAP_SPARKLE_PUBLIC_ED_KEY"
          test "$(plutil -extract SURequireSignedFeed raw "$APP_PATH/Contents/Info.plist")" = true
          test "$(plutil -extract SUVerifyUpdateBeforeExtraction raw "$APP_PATH/Contents/Info.plist")" = true
          ../../apps/pokemap_hub/tool/release/sign_macos_app.sh \
            --app "$APP_PATH" \
            --identity "$DEVELOPER_ID_APPLICATION" \
            --entitlements macos/Runner/Release.entitlements
      - name: Notarize, staple and assess PokeMap
        working-directory: packages/map_editor
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials pokemap-release \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
          ../../apps/pokemap_hub/tool/release/notarize_macos_release.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --dmg "build/release/PokeMap-Editor-$RELEASE_VERSION-macOS.dmg" \
            --notary-profile pokemap-release \
            --result-json "$RUNNER_TEMP/notary-result.json" \
            --log-directory "$RUNNER_TEMP/notary-logs" \
            --volume-name PokeMap
      - name: Package signed Sparkle update
        working-directory: packages/map_editor
        env:
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY_BASE64"
          PRIVATE_KEY="$RUNNER_TEMP/sparkle-private.key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY_BASE64" | base64 --decode > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"
          GENERATE_APPCAST="$(find build/macos -type f \
            -path '*/Sparkle/bin/generate_appcast' -perm -111 -print -quit)"
          test -n "$GENERATE_APPCAST"
          tool/release/package_macos_update.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --version "$RELEASE_VERSION" \
            --output-dir build/release \
            --generate-appcast "$GENERATE_APPCAST" \
            --private-key-file "$PRIVATE_KEY" \
            --download-url-prefix \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          grep -q '<!-- sparkle-signatures:' build/release/appcast-macos.xml
      - name: Preserve notarized macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-macos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            packages/map_editor/build/release/PokeMap-Editor-*-macOS.dmg
            packages/map_editor/build/release/PokeMap-Editor-*-macOS.app.zip
            packages/map_editor/build/release/appcast-macos.xml

  assemble-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs:
      - validate-release
      - windows-release
      - linux-release
      - macos-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pokemap-release
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.validate-release.outputs.build_number }}
      POKEMAP_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.POKEMAP_SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-windows-${{ github.sha }}
          path: dist
      - name: Download Linux package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-linux-${{ github.sha }}
          path: dist
      - name: Download macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-macos-${{ github.sha }}
          path: dist
      - name: Generate and validate release metadata
        working-directory: packages/map_editor
        run: |
          test -n "$POKEMAP_SPARKLE_PUBLIC_ED_KEY"
          flutter pub get
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          dart run tool/release/generate_update_index.dart \
            --output ../../dist/pokemap-update-index.json \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --published-at "$PUBLISHED_AT" \
            --repository "$GITHUB_REPOSITORY"
          dart run tool/release/validate_update_assets.dart \
            --directory ../../dist \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --macos-public-key "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" \
            --windows-manual \
            --write-checksums
          test -s ../../dist/SHA256SUMS
      - name: Preserve complete release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: dist/*

  create-draft-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs:
      - validate-release
      - assemble-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download complete release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-release-${{ github.sha }}
          path: dist
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          EXISTING_RELEASE_ID="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"
          )"
          if [[ -n "$EXISTING_RELEASE_ID" ]]; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 65
          fi
          gh release create "$GITHUB_REF_NAME" --draft \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PokeMap $RELEASE_VERSION" \
            --generate-notes

  smoke-download-draft:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs:
      - validate-release
      - create-draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pokemap-release
    # Draft releases are hidden from read-only GitHub Actions tokens.
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.validate-release.outputs.build_number }}
      POKEMAP_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.POKEMAP_SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Re-download draft assets from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          DRAFT_RELEASE_ID="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft == true) | .id"
          )"
          if [[ ! "$DRAFT_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Expected exactly one draft release for $GITHUB_REF_NAME." >&2
            exit 66
          fi
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
              if [[ -z "$ASSET_ID" || -z "$ASSET_NAME" || "$ASSET_NAME" == */* ]]; then
                echo "Unsafe or incomplete draft asset metadata." >&2
                exit 67
              fi
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
                > "dist/$ASSET_NAME"
            done
      - name: Revalidate downloaded hashes, metadata and signatures
        working-directory: packages/map_editor
        run: |
          flutter pub get
          dart run tool/release/validate_update_assets.dart \
            --directory ../../dist \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --macos-public-key "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" \
            --windows-manual

  publish-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs: smoke-download-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish validated versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT_RELEASE_ID="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft == true) | .id"
          )"
          if [[ ! "$DRAFT_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Expected exactly one validated draft release for $GITHUB_REF_NAME." >&2
            exit 68
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
            -F draft=false >/dev/null
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false

  promote-stable-feed:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs:
      - validate-release
      - publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      STABLE_TAG: pokemap-editor-update-stable
    steps:
      - name: Download validated stable metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir stable
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir stable \
            --pattern appcast-macos.xml \
            --pattern pokemap-update-index.json
      - name: Ensure rolling stable release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STABLE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PokeMap Editor stable update feed" \
              --notes "Machine-readable stable update metadata."
          fi
      - name: Promote macOS appcast first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$STABLE_TAG" \
            stable/appcast-macos.xml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Promote stable update index last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$STABLE_TAG" \
            stable/pokemap-update-index.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Verify rolling stable download URLs
        run: |
          for ASSET_NAME in appcast-macos.xml pokemap-update-index.json; do
            VERIFIED=false
            for ATTEMPT in 1 2 3 4 5 6; do
              curl --fail --location --silent --show-error \
                -H 'Cache-Control: no-cache' \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$STABLE_TAG/$ASSET_NAME?run=$GITHUB_RUN_ID&attempt=$ATTEMPT" \
                --output "$RUNNER_TEMP/$ASSET_NAME"
              if cmp --silent "stable/$ASSET_NAME" "$RUNNER_TEMP/$ASSET_NAME"; then
                VERIFIED=true
                break
              fi
              sleep 5
            done
            test "$VERIFIED" = true
          done
