name: PokeMap desktop distribution

on:
  pull_request:
    paths:
      - "packages/map_core/**"
      - "packages/map_distribution/**"
      - "packages/map_editor/**"
      - "packages/map_gameplay/**"
      - "packages/map_runtime/**"
      - "apps/pokemap_hub/tool/release/notarize_macos_release.sh"
      - "apps/pokemap_hub/tool/release/sign_macos_app.sh"
      - ".github/workflows/pokemap_desktop_release.yml"
  push:
    branches: [main]
    tags: ["pokemap-v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.46.0-0.3.pre
  FLUTTER_REVISION: 677d472756f83c14371dd8cc624387065f3d32a7

jobs:
  validate-release:
    if: startsWith(github.ref, 'refs/tags/pokemap-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Validate release tag and build
        working-directory: packages/map_editor
        run: |
          flutter pub get
          dart run tool/release/validate_release_version.dart --tag "$GITHUB_REF_NAME" --pubspec pubspec.yaml

  macos-preview:
    if: ${{ !startsWith(github.ref, 'refs/tags/pokemap-v') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and build macOS preview
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build macos --release
          tool/release/package_macos_preview.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --dmg build/release/PokeMap-macos-preview.dmg
      - name: Preserve macOS preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-macos-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: packages/map_editor/build/release/PokeMap-macos-preview.dmg

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/pokemap-v') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$env:RUNNER_TEMP/flutter" fetch --depth 1 origin `
            "refs/tags/$env:FLUTTER_VERSION`:refs/tags/$env:FLUTTER_VERSION"
          git -C "$env:RUNNER_TEMP/flutter" checkout --detach "$env:FLUTTER_VERSION"
          $revision = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($revision -ne "$env:FLUTTER_REVISION") {
            throw "Unexpected Flutter revision: $revision"
          }
          "$env:RUNNER_TEMP/flutter/bin" |
            Out-File -FilePath "$env:GITHUB_PATH" -Encoding utf8 -Append
      - name: Test, build and package Windows
        working-directory: packages/map_editor
        shell: pwsh
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build windows --release
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/PokeMap.exe")) {
            throw "PokeMap Windows executable is missing."
          }
          New-Item -ItemType Directory -Force -Path "build/release" | Out-Null
          Compress-Archive -Path "$bundle/*" `
            -DestinationPath "build/release/PokeMap-windows-x64.zip"
      - name: Preserve Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: packages/map_editor/build/release/PokeMap-windows-x64.zip

  windows-release:
    if: ${{ startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs: validate-release
    runs-on: windows-2025
    timeout-minutes: 60
    environment: pokemap-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$env:RUNNER_TEMP/flutter" fetch --depth 1 origin `
            "refs/tags/$env:FLUTTER_VERSION`:refs/tags/$env:FLUTTER_VERSION"
          git -C "$env:RUNNER_TEMP/flutter" checkout --detach "$env:FLUTTER_VERSION"
          $revision = git -C "$env:RUNNER_TEMP/flutter" rev-parse HEAD
          if ($revision -ne "$env:FLUTTER_REVISION") {
            throw "Unexpected Flutter revision: $revision"
          }
          "$env:RUNNER_TEMP/flutter/bin" |
            Out-File -FilePath "$env:GITHUB_PATH" -Encoding utf8 -Append
      - name: Build verified WinSparkle runner
        working-directory: packages/map_editor
        shell: pwsh
        env:
          POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY)) {
            throw "POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY is required."
          }
          try {
            $publicKeyBytes = [Convert]::FromBase64String(
              $env:POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY
            )
          } catch {
            throw "POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY must be valid base64."
          }
          if ($publicKeyBytes.Length -ne 32) {
            throw "POKEMAP_WINSPARKLE_EDDSA_PUBLIC_KEY must encode 32 bytes."
          }
          flutter pub get
          flutter test test/release test/features/editor_updates/native_update_phase3_contract_test.dart
          flutter analyze
          flutter build windows --release
          $bundle = "build/windows/x64/runner/Release"
          foreach ($file in @("PokeMap.exe", "WinSparkle.dll")) {
            if (-not (Test-Path "$bundle/$file")) {
              throw "PokeMap Windows bundle is missing $file."
            }
          }
      - name: Package signed Windows update
        working-directory: packages/map_editor
        shell: pwsh
        env:
          WINSPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.WINSPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINSPARKLE_PRIVATE_ED_KEY_BASE64)) {
            throw "WINSPARKLE_PRIVATE_ED_KEY_BASE64 is required."
          }
          $privateKey = Join-Path $env:RUNNER_TEMP "winsparkle-private.key"
          [IO.File]::WriteAllBytes(
            $privateKey,
            [Convert]::FromBase64String($env:WINSPARKLE_PRIVATE_ED_KEY_BASE64)
          )
          $tool = Get-ChildItem "build/windows/x64/winsparkle/0.9.4" `
            -Filter "winsparkle-tool.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) {
            throw "winsparkle-tool was not found in the pinned NuGet package."
          }
          $version = $env:GITHUB_REF_NAME -replace '^pokemap-v', ''
          ./tool/release/package_windows_update.ps1 `
            -Version $version `
            -BundleDir "build/windows/x64/runner/Release" `
            -OutputDir "build/release" `
            -PrivateKeyFile $privateKey `
            -WinSparkleTool $tool
      - name: Preserve signed Windows update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            packages/map_editor/build/release/PokeMap-Editor-Setup-*.exe
            packages/map_editor/build/release/appcast-windows.xml

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test, build and package Linux
        working-directory: packages/map_editor
        run: |
          flutter pub get
          flutter test test/release
          flutter analyze
          flutter build linux --release
          test -x build/linux/x64/release/bundle/pokemap
          mkdir -p build/release
          tar -C build/linux/x64/release/bundle -czf \
            build/release/PokeMap-linux-x64.tar.gz .
      - name: Preserve Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: packages/map_editor/build/release/PokeMap-linux-x64.tar.gz

  macos-release:
    if: ${{ startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs:
      - validate-release
      - windows-release
      - linux
    runs-on: macos-15
    timeout-minutes: 60
    environment: pokemap-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin \
            "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Import ephemeral Developer ID identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pokemap-release.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build and sign PokeMap
        working-directory: packages/map_editor
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          POKEMAP_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.POKEMAP_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          test -n "$DEVELOPER_ID_APPLICATION"
          test -n "$POKEMAP_SPARKLE_PUBLIC_ED_KEY"
          SPARKLE_PUBLIC_KEY_BYTES="$(
            printf '%s' "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" | base64 --decode | wc -c | tr -d ' '
          )"
          test "$SPARKLE_PUBLIC_KEY_BYTES" = 32
          printf 'POKEMAP_SPARKLE_PUBLIC_ED_KEY = "%s"\n' \
            "$POKEMAP_SPARKLE_PUBLIC_ED_KEY" \
            > macos/Runner/Configs/UpdateKeys.xcconfig
          flutter pub get
          flutter test test/release test/features/editor_updates/native_update_phase3_contract_test.dart
          flutter analyze
          flutter build macos --release
          ../../apps/pokemap_hub/tool/release/sign_macos_app.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --identity "$DEVELOPER_ID_APPLICATION" \
            --entitlements macos/Runner/Release.entitlements
      - name: Notarize, staple and assess PokeMap
        working-directory: packages/map_editor
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials pokemap-release \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
          VERSION="${GITHUB_REF_NAME#pokemap-v}"
          ../../apps/pokemap_hub/tool/release/notarize_macos_release.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --dmg "build/release/PokeMap-Editor-$VERSION-macOS.dmg" \
            --notary-profile pokemap-release \
            --result-json "$RUNNER_TEMP/notary-result.json" \
            --log-directory "$RUNNER_TEMP/notary-logs" \
            --volume-name PokeMap
      - name: Package signed Sparkle update
        working-directory: packages/map_editor
        env:
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY_BASE64"
          PRIVATE_KEY="$RUNNER_TEMP/sparkle-private.key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY_BASE64" | base64 --decode > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"
          GENERATE_APPCAST="$(find build/macos -type f \
            -path '*/Sparkle/bin/generate_appcast' -perm -111 -print -quit)"
          test -n "$GENERATE_APPCAST"
          VERSION="${GITHUB_REF_NAME#pokemap-v}"
          tool/release/package_macos_update.sh \
            --app "build/macos/Build/Products/Release/PokeMap.app" \
            --version "$VERSION" \
            --output-dir build/release \
            --generate-appcast "$GENERATE_APPCAST" \
            --private-key-file "$PRIVATE_KEY" \
            --download-url-prefix \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
      - name: Preserve notarized macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pokemap-macos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            packages/map_editor/build/release/PokeMap-Editor-*-macOS.dmg
            packages/map_editor/build/release/PokeMap-Editor-*-macOS.app.zip
            packages/map_editor/build/release/appcast-macos.xml

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/pokemap-v') }}
    needs:
      - windows-release
      - linux
      - macos-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-windows-${{ github.sha }}
          path: dist
      - name: Download Linux package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-linux-${{ github.sha }}
          path: dist
      - name: Download macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pokemap-macos-${{ github.sha }}
          path: dist
      - name: Publish PokeMap GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PokeMap ${GITHUB_REF_NAME#pokemap-v}" \
            --generate-notes
