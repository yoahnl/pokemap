name: BETA PERF stop-ship certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.46.0-0.3.pre
  FLUTTER_REVISION: 677d472756f83c14371dd8cc624387065f3d32a7

jobs:
  perf-000-001:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Certify BETA-PERF-000 and BETA-PERF-001
        run: |
          set -euo pipefail
          git checkout --detach cc5a72ab12802d845260beeca4478aac2fe3f540
          test "$(git rev-parse HEAD)" = "cc5a72ab12802d845260beeca4478aac2fe3f540"
          mkdir -p "$RUNNER_TEMP/evidence/perf-000-001"
          printf 'tickets=BETA-PERF-000,BETA-PERF-001\naudited_sha=%s\nrunner_arch=%s\n' "$(git rev-parse HEAD)" "$(uname -m)" > "$RUNNER_TEMP/evidence/perf-000-001/metadata.txt"
          cd packages/map_authoring
          dart pub get
          dart test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/evidence/perf-000-001/map_authoring_test.log"
          dart analyze 2>&1 | tee "$RUNNER_TEMP/evidence/perf-000-001/map_authoring_analyze.log"
          cd ../map_editor
          flutter pub get
          flutter test --no-pub --reporter expanded test/application/services/editor_performance_telemetry_test.dart test/performance_driver_contract_test.dart test/integration_support/vm_memory_probe_test.dart test/map_canvas_pointer_navigation_test.dart test/collision_generation/placed_element_auto_collision_copy_test.dart test/element_collision_editor_sheet_fine_mask_test.dart test/smart_tiles_studio/smart_tile_canonical_editor_flow_test.dart 2>&1 | tee "$RUNNER_TEMP/evidence/perf-000-001/map_editor_targeted_test.log"
          flutter drive --profile -d macos --driver=test_driver/fine_mask_performance_driver.dart --target=integration_test/editor_fine_mask_journey_test.dart --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_fine_mask_journey.json 2>&1 | tee "$RUNNER_TEMP/evidence/perf-000-001/fine_mask_profile.log"
          flutter drive --profile -d macos --driver=test_driver/performance_driver.dart --target=integration_test/editor_project_journey_test.dart --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_project_journey.json 2>&1 | tee "$RUNNER_TEMP/evidence/perf-000-001/project_profile.log"
          flutter drive --profile -d macos --driver=test_driver/performance_driver.dart --target=integration_test/editor_canvas_projection_journey_test.dart --dart-define=POKEMAP_PERF_OUTPUT=build/performance/editor_canvas_projection_journey.json 2>&1 | tee "$RUNNER_TEMP/evidence/perf-000-001/canvas_profile.log"
          cp build/performance/editor_fine_mask_journey.json "$RUNNER_TEMP/evidence/perf-000-001/"
          cp build/performance/editor_project_journey.json "$RUNNER_TEMP/evidence/perf-000-001/"
          cp build/performance/editor_canvas_projection_journey.json "$RUNNER_TEMP/evidence/perf-000-001/"
      - name: Upload BETA-PERF-000 and BETA-PERF-001 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-perf-000-001-cc5a72ab12802d845260beeca4478aac2fe3f540
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/evidence/perf-000-001

