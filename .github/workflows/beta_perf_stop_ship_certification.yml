          dart run benchmark/map_cell_stroke_scaling.dart --warmups 1 --samples 3 --extents 128,256,512,1024 --output build/performance/perf_005_validation_final.json 2>&1 | tee "$RUNNER_TEMP/evidence/perf-005/benchmark.log"
          cp build/performance/perf_005_validation_final.json "$RUNNER_TEMP/evidence/perf-005/"
