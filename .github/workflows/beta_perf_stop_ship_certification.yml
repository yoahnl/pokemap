      - name: Certify BETA-PERF-004
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout --force --detach 993cb50aead6b75ede4e889ac82c5109dabe2289
          git clean -fdx
          mkdir -p "$RUNNER_TEMP/evidence/perf-004"
          printf 'ticket=BETA-PERF-004\naudited_sha=%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/evidence/perf-004/metadata.txt"
          cd packages/map_editor
          flutter pub get
          flutter test --no-pub --concurrency=1 test/application/services/editor_performance_telemetry_test.dart test/application/services/map_cell_stroke_buffer_test.dart test/features/editor/state/editor_notifier_map_cell_stroke_buffer_test.dart test/benchmark/map_cell_stroke_scaling_cli_test.dart test/map_grid_painter_test.dart test/smart_tiles_studio/smart_tile_map_editing_test.dart test/smart_tiles_studio/smart_tile_gesture_burst_test.dart test/smart_tiles_studio/smart_tile_canonical_editor_flow_test.dart -r expanded 2>&1 | tee "$RUNNER_TEMP/evidence/perf-004/targeted_test.log"
          dart run benchmark/map_cell_stroke_scaling.dart --warmups 2 --samples 10 --extents 128,256,512,1024 --output build/performance/map_cell_stroke_scaling.perf004.review.json 2>&1 | tee "$RUNNER_TEMP/evidence/perf-004/benchmark.log"
          cp build/performance/map_cell_stroke_scaling.perf004.review.json "$RUNNER_TEMP/evidence/perf-004/"
      - name: Certify BETA-PERF-005
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout --force --detach 75032618ccc4f9bdc6ea44d138fa25bcc68f5b39
          git clean -fdx
          mkdir -p "$RUNNER_TEMP/evidence/perf-005"
          printf 'ticket=BETA-PERF-005\naudited_sha=%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/evidence/perf-005/metadata.txt"
          cd packages/map_core
          dart pub get
