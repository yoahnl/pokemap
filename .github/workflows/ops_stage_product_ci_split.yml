name: Ops stage product CI split

on:
  push:
    branches: [codex/perf-009-soak-gate]
    paths:
      - ".github/workflows/ops_stage_product_ci_split.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Stage split map editor quality workflow
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.github/workflows/pokemap_hub_product_certification.yml')
          staged = Path('tools/ci/pokemap_hub_product_certification.staged.yml')
          text = source.read_text()
          start_marker = '\n  map-editor-quality:\n'
          end_marker = '\n  map-editor-performance-gate:\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = base64.b64decode('').decode()
          patched = text[:start] + replacement + text[end:]
          if patched == text:
              raise SystemExit('workflow patch produced no change')
          if '\n  map-editor-quality:\n' in patched:
              raise SystemExit('legacy combined quality job still present')
          if '\n  map-editor-functional-quality:\n' not in patched:
              raise SystemExit('functional quality job missing')
          if '\n  map-editor-performance-quality:\n' not in patched:
              raise SystemExit('performance quality job missing')
          staged.parent.mkdir(parents=True, exist_ok=True)
          staged.write_text(patched)
          PY
      - name: Commit staged workflow blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ci/pokemap_hub_product_certification.staged.yml
          git diff --cached --check
          git commit -m "ci: stage split map editor quality workflow"
          git push origin HEAD:codex/perf-009-soak-gate
